[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "first-pr-agent"
version = "0.1.0"
description = "TinyFish-powered agent: find a good-first-issue, mine the project's contribution rules, locate the code, draft the PR."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []  # stdlib only on purpose: nothing to install but this package

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
firstpr = "firstpr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firstpr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
